<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Voice AI Assistant</title>
  <style>
    :root {
      --bg: #f6f5f1;
      --card: #ffffff;
      --text: #1d1d1b;
      --muted: #6f6e68;
      --border: #e2e0d8;
      --accent: #5b4bdb;
      --accent-text: #ffffff;
      --user: #ece9ff;
      --bot: #f1f0ea;
      --rec: #d93a3a;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #151517;
        --card: #1f1f23;
        --text: #ececea;
        --muted: #9a9993;
        --border: #333339;
        --accent: #8b7dff;
        --accent-text: #111;
        --user: #2b2750;
        --bot: #2a2a2f;
        --rec: #ff6161;
      }
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      display: flex;
      justify-content: center;
      padding: 24px 16px;
    }

    .app {
      width: 100%;
      max-width: 640px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      height: calc(100vh - 48px);
      max-height: 820px;
    }

    header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h1 {
      font-size: 17px;
      margin: 0;
      font-weight: 600;
    }

    header p {
      margin: 2px 0 0;
      font-size: 12px;
      color: var(--muted);
    }

    .link-btn {
      background: none;
      border: 1px solid var(--border);
      color: var(--muted);
      border-radius: 8px;
      padding: 6px 10px;
      font-size: 12px;
      cursor: pointer;
    }

    .link-btn:hover {
      color: var(--text);
    }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .empty {
      margin: auto;
      text-align: center;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.6;
    }

    .msg {
      max-width: 85%;
      padding: 10px 14px;
      border-radius: 14px;
      font-size: 14.5px;
      line-height: 1.5;
      word-wrap: break-word;
    }

    .msg.user {
      align-self: flex-end;
      background: var(--user);
      border-bottom-right-radius: 4px;
    }

    .msg.bot {
      align-self: flex-start;
      background: var(--bot);
      border-bottom-left-radius: 4px;
    }

    .msg.error {
      align-self: center;
      background: transparent;
      color: var(--rec);
      border: 1px solid var(--rec);
      font-size: 13px;
    }

    .msg audio {
      display: block;
      margin-top: 8px;
      height: 32px;
      max-width: 100%;
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 8px;
    }

    .chip {
      font-size: 11px;
      color: var(--muted);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 2px 8px;
    }

    .controls {
      border-top: 1px solid var(--border);
      padding: 16px 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      align-items: center;
    }

    #recBtn {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      border: none;
      cursor: pointer;
      background: var(--accent);
      color: var(--accent-text);
      font-size: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #recBtn.recording {
      background: var(--rec);
      animation: pulse 1.2s infinite;
    }

    #recBtn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    @keyframes pulse {
      0% {
        box-shadow: 0 0 0 0 rgba(217, 58, 58, .5);
      }

      70% {
        box-shadow: 0 0 0 16px rgba(217, 58, 58, 0);
      }

      100% {
        box-shadow: 0 0 0 0 rgba(217, 58, 58, 0);
      }
    }

    #status {
      font-size: 13px;
      color: var(--muted);
      min-height: 18px;
    }

    #language {
      padding: 6px 10px;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      background: var(--bg);
    }

    .textrow {
      display: flex;
      gap: 8px;
      width: 100%;
    }

    .textrow input {
      flex: 1;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font-size: 14px;
    }

    .textrow button {
      padding: 10px 16px;
      border-radius: 10px;
      border: none;
      background: var(--accent);
      color: var(--accent-text);
      font-size: 14px;
      cursor: pointer;
    }

    .textrow button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
  </style>
</head>

<body>
  <div class="app">
    <header>
      <div>
        <h1>Voice AI Assistant</h1>
        <p>Whisper → Ollama → Text-to-Speech</p>
      </div>
      <button class="link-btn" id="newBtn">New conversation</button>
    </header>

    <div id="chat">
      <div class="empty" id="empty">Tap the microphone and speak.<br>Tap again to stop and send.</div>
    </div>

    <div class="controls">
      <label for="language">Language
        <select id="language">
          <option value="en">English</option>
          <option value="hi" lang="hi">हिन्दी</option>
        </select>
      </label>
      <button id="recBtn" title="Record">🎤</button>
      <div id="status">Ready</div>
      <div class="textrow">
        <input id="textIn" type="text" placeholder="Or type a message…" autocomplete="off">
        <button id="sendBtn">Send</button>
      </div>
    </div>
  </div>

  <script>
    const chat = document.getElementById("chat");
    const empty = document.getElementById("empty");
    const recBtn = document.getElementById("recBtn");
    const statusEl = document.getElementById("status");
    const textIn = document.getElementById("textIn");
    const sendBtn = document.getElementById("sendBtn");
    const newBtn = document.getElementById("newBtn");
    const languageSelect = document.getElementById("language");

    let sessionId = null;
    let recorder = null;
    let chunks = [];
    let stream = null;
    let busy = false;

    function setStatus(t) { statusEl.textContent = t; }

    function setBusy(b) {
      busy = b;
      recBtn.disabled = b;
      sendBtn.disabled = b;
    }

    function addMessage(role, text, extra) {
      if (empty) empty.style.display = "none";
      const div = document.createElement("div");
      div.className = "msg " + role;
      div.textContent = text;
      if (extra && extra.audioUrl) {
        const a = document.createElement("audio");
        a.controls = true;
        a.src = extra.audioUrl;
        div.appendChild(a);
      }
      if (extra && extra.latency) {
        const chips = document.createElement("div");
        chips.className = "chips";
        const L = extra.latency;
        const parts = [["STT", L.stt], ["LLM", L.llm], ["TTS", L.tts], ["Total", L.total]];
        for (const [name, val] of parts) {
          if (val === undefined) continue;
          const c = document.createElement("span");
          c.className = "chip";
          c.textContent = name + " " + val + " ms";
          chips.appendChild(c);
        }
        div.appendChild(chips);
      }
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
      return div;
    }

    async function readError(res) {
      try {
        const j = await res.json();
        return j.detail || ("Error " + res.status);
      } catch (e) {
        return "Error " + res.status;
      }
    }

    function playReply(div) {
      const a = div.querySelector("audio");
      if (a) a.play().catch(() => { });
    }

    async function sendVoice(blob) {
      setBusy(true);
      setStatus("Transcribing and thinking…");
      try {
        const form = new FormData();
        form.append("audio", blob, "recording.webm");
        form.append("language", languageSelect.value);
        if (sessionId) form.append("session_id", sessionId);
        const res = await fetch("/voice", { method: "POST", body: form });
        if (!res.ok) throw new Error(await readError(res));
        const data = await res.json();
        sessionId = data.session_id;
        addMessage("user", data.transcript);
        const botDiv = addMessage("bot", data.reply, { audioUrl: data.audio_url, latency: data.latency_ms });
        playReply(botDiv);
        setStatus("Ready");
      } catch (err) {
        addMessage("error", String(err.message || err));
        setStatus("Ready");
      } finally {
        setBusy(false);
      }
    }

    async function sendText() {
      const text = textIn.value.trim();
      if (!text || busy) return;
      textIn.value = "";
      addMessage("user", text);
      setBusy(true);
      setStatus("Thinking…");
      try {
        const res = await fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            text, session_id: sessionId, speak: true, language: languageSelect.value
          })
        });
        if (!res.ok) throw new Error(await readError(res));
        const data = await res.json();
        sessionId = data.session_id;
        const botDiv = addMessage("bot", data.reply, { audioUrl: data.audio_url, latency: data.latency_ms });
        playReply(botDiv);
        setStatus("Ready");
      } catch (err) {
        addMessage("error", String(err.message || err));
        setStatus("Ready");
      } finally {
        setBusy(false);
      }
    }

    async function startRecording() {
      try {
        stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      } catch (e) {
        addMessage("error", "Microphone access was blocked. Allow the microphone in your browser and try again.");
        return;
      }
      chunks = [];
      recorder = new MediaRecorder(stream);
      recorder.ondataavailable = (e) => { if (e.data.size > 0) chunks.push(e.data); };
      recorder.onstop = () => {
        stream.getTracks().forEach((t) => t.stop());
        const blob = new Blob(chunks, { type: recorder.mimeType || "audio/webm" });
        if (blob.size < 1000) {
          setStatus("Too short, try again");
          return;
        }
        sendVoice(blob);
      };
      recorder.start();
      recBtn.classList.add("recording");
      recBtn.textContent = "⏹";
      setStatus("Listening… tap to stop");
    }

    function stopRecording() {
      if (recorder && recorder.state !== "inactive") recorder.stop();
      recBtn.classList.remove("recording");
      recBtn.textContent = "🎤";
    }

    recBtn.addEventListener("click", () => {
      if (busy) return;
      if (recorder && recorder.state === "recording") stopRecording();
      else startRecording();
    });

    sendBtn.addEventListener("click", sendText);
    textIn.addEventListener("keydown", (e) => { if (e.key === "Enter") sendText(); });

    newBtn.addEventListener("click", async () => {
      if (sessionId) {
        try { await fetch("/session/" + sessionId, { method: "DELETE" }); } catch (e) { }
      }
      sessionId = null;
      chat.innerHTML = "";
      chat.appendChild(empty);
      empty.style.display = "";
      setStatus("Ready");
    });
  </script>
</body>

</html>
